name: freeze
on: workflow_dispatch
permissions: {}
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/fcenv
          key: fcenv-nemo3.0.0-py3.11-v1
      - run: |
          python --version; pip freeze | sort
          echo ===FCENV===
          if [ -x /tmp/fcenv/bin/pip ]; then /tmp/fcenv/bin/pip freeze | sort; else echo "no fcenv cache"; fi
