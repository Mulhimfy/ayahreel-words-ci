name: third
# More opinions on the verses two models can't settle (the private
# project's pipeline/run_third.py): "eval" aligns ground-truth voices with
# every model to measure what a third opinion may decide; "dispute" runs
# the extra models on a voice's disputed verses. The code is checked out
# with a read-only deploy key, and each job's output and log are
# encrypted before they are uploaded: nothing readable leaves a job.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: eval | dispute
        default: eval
      jobs:
        description: '[{"voice": "...", "surahs": "1,36"}, ...] (eval: per-ayah voices take "small" or "big")'
        required: true
      models:
        description: comma-separated models, the first as production's first
        default: rabah8,mms8,kuran,hamza
      extra:
        description: more arguments for run_third (e.g. --all)
        default: ''
      ref:
        description: the private project's branch or commit
        default: main
      tag:
        description: artifact name part, to tell runs apart
        default: t1
      parallel:
        description: jobs at once (be kind to the audio hosts)
        default: '12'
      jobs_file:
        description: 'dispute: the private project''s jobs file'
        default: data/third_jobs.json
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          JOBS: ${{ inputs.jobs }}
        run: |
          python3 -c "
          import json, os
          jobs = json.loads(os.environ['JOBS'])
          m = [dict(voice=j['voice'], surahs=str(j.get('surahs', '')), part=i) for i, j in enumerate(jobs)]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps(m) + '\n')
          "
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.parallel) }}
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mulhimfy/ayahreel-words
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.WORDS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: deps
        env:
          MODELS: ${{ inputs.models }}
          MODE: ${{ inputs.mode }}
        run: |
          # ffmpeg without apt (its lock has held jobs here for half an
          # hour): a static build from PyPI
          if ! command -v ffmpeg >/dev/null; then
            pip install -q imageio-ffmpeg==0.5.1
            mkdir -p "$HOME/bin"
            ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          ffmpeg -version | head -1
          if echo "$MODELS" | grep -qE '^(fc|fcr[a-z0-9]*)(,(fc|fcr[a-z0-9]*))*$' && [ "$MODE" = dispute ]; then
            # FastConformer runs in its own environment: here only the
            # alignment's own needs
            pip install -q numpy==1.26.4 numba==0.60.0
          else
            pip install -q torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
            pip install -q -r requirements.txt
          fi
      - id: fcneed
        env:
          MODELS: ${{ inputs.models }}
        run: |
          if echo "$MODELS" | tr ',' '\n' | grep -qE '^fc'; then echo "on=1" >> "$GITHUB_OUTPUT"; fi
          if echo "$MODELS" | tr ',' '\n' | grep -qE '^(fcr|w2r)'; then echo "own=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        if: steps.fcneed.outputs.on == '1'
        with:
          path: /tmp/fcenv
          key: fcenv-nemo3.0.0-py3.11-v1
      - name: deps for the FastConformer model (its own environment, NeMo's pins)
        if: steps.fcneed.outputs.on == '1'
        run: |
          if [ ! -x /tmp/fcenv/bin/python ]; then
            python -m venv /tmp/fcenv
            /tmp/fcenv/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu \
              "nemo-toolkit[asr]==3.0.0" torch torchaudio soundfile safetensors pyyaml huggingface_hub
          fi
          echo "FC_PYTHON=/tmp/fcenv/bin/python" >> "$GITHUB_ENV"
      # Our own fine-tuned weights (fcr*, w2r*): the private project's "weights"
      # branch, with the same read-only key; never printed or uploaded.
      - uses: actions/checkout@v4
        if: steps.fcneed.outputs.own == '1'
        with:
          repository: Mulhimfy/ayahreel-words
          ref: weights
          path: wts
          ssh-key: ${{ secrets.WORDS_DEPLOY_KEY }}
          persist-credentials: false
      - name: our weights
        if: steps.fcneed.outputs.own == '1'
        run: |
          for d in wts/*/; do
            if ls "$d"model.safetensors.part* >/dev/null 2>&1; then
              cat "$d"model.safetensors.part* > "$d"model.safetensors
              rm -f "$d"model.safetensors.part*
            fi
          done
          rm -rf wts/.git
          echo "FCR_ROOT=$PWD/wts" >> "$GITHUB_ENV"
      - id: key
        env:
          MODELS: ${{ inputs.models }}
        run: echo "key=models-$(echo "$MODELS" | tr ',' '-')-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ steps.key.outputs.key }}
      - name: run
        # Short of the job's limit, so the seal below still runs and what
        # was measured is kept.
        timeout-minutes: 330
        env:
          MODE: ${{ inputs.mode }}
          VOICE: ${{ matrix.voice }}
          SURAHS: ${{ matrix.surahs }}
          MODELS: ${{ inputs.models }}
          EXTRA: ${{ inputs.extra }}
          JOBS_FILE: ${{ inputs.jobs_file }}
        run: |
          mkdir -p out log
          args=(--voice "$VOICE" --models "$MODELS" --out out --work work)
          if [ "$MODE" = eval ]; then
            case "$SURAHS" in
              small|big) args+=(--sample "$SURAHS") ;;
              *) args+=(--surahs "$SURAHS") ;;
            esac
          else
            args+=(--jobs "${JOBS_FILE:-data/third_jobs.json}")
            [ -n "$SURAHS" ] && args+=(--surahs "$SURAHS")
          fi
          # shellcheck disable=SC2086
          if ! python -m pipeline.run_third "$MODE" "${args[@]}" $EXTRA \
              > log/log.txt 2>&1; then
            echo "the job failed; its log is in the encrypted output"
            exit 1
          fi
          echo "done"
      - name: seal
        if: always()
        env:
          KEY: ${{ secrets.WORDS_ENC_KEY }}
        run: |
          mkdir -p out log sealed
          tar -czf - -C out . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:KEY -out sealed/third.tgz.enc
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY \
            -in log/log.txt -out sealed/log.txt.enc 2>/dev/null || true
          rm -rf out log work wts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-${{ inputs.tag }}-${{ matrix.voice }}-${{ matrix.part }}
          path: sealed
          retention-days: 30
